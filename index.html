<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premium .si domene</title>
<meta name="description" content="Premium .si domene na prodaj.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbfaf7;
    --text: #0f0f0e;
    --muted: #77756f;
    --faint: #a9a69e;
    --line: #e7e4dd;
    --btn: #0f0f0e;
    --btn-text: #fbfaf7;
    --serif: "Instrument Serif", Georgia, serif;
    --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0c;
      --text: #f2f0eb;
      --muted: #8f8c85;
      --faint: #5c5a55;
      --line: #23221f;
      --btn: #f2f0eb;
      --btn-text: #0d0d0c;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); }
  a { color: inherit; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
  @media (max-width: 560px) { .wrap { padding: 0 16px; } }

  /* top */
  .top { display: flex; justify-content: space-between; align-items: center; height: 76px; border-bottom: 1px solid var(--line); }
  .brand { font-family: var(--serif); font-size: 24px; text-decoration: none; letter-spacing: -0.01em; }
  .lang { display: flex; gap: 2px; }
  .lang button {
    background: none; border: 0; color: var(--faint); font: 500 12px var(--sans);
    letter-spacing: .08em; padding: 6px 8px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { color: var(--text); }

  /* hero */
  .hero { padding: 112px 0 96px; border-bottom: 1px solid var(--line); }
  @media (max-width: 560px) { .hero { padding: 64px 0 56px; } }
  .eyebrow { font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 28px; }
  .eyebrow::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #3a9a6a; margin-right: 10px; vertical-align: 2px; }
  h1 {
    font-family: var(--serif); font-weight: 400; margin: 0;
    font-size: clamp(52px, 11vw, 128px); line-height: .95; letter-spacing: -0.03em; word-break: break-word;
  }
  h1 .tld { color: var(--faint); }
  .lead { font-size: 17px; color: var(--muted); margin: 28px 0 0; max-width: 32em; }
  .deal { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 32px 48px; margin-top: 56px; }
  .deal[hidden] { display: none; }
  .price-label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .price { font-family: var(--serif); font-size: 40px; line-height: 1; margin-top: 8px; letter-spacing: -0.01em; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 28px;
    border-radius: 999px; font: 500 15px var(--sans); text-decoration: none; cursor: pointer;
    border: 1px solid var(--btn); background: var(--btn); color: var(--btn-text); transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }

  .facts { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
  .facts div { padding: 28px 24px 28px 0; }
  .facts div + div { border-left: 1px solid var(--line); padding-left: 24px; }
  .facts b { display: block; font-weight: 500; font-size: 14px; }
  .facts span { color: var(--muted); font-size: 13px; }
  @media (max-width: 720px) {
    .facts { grid-template-columns: 1fr; }
    .facts div { padding: 20px 0; }
    .facts div + div { border-left: 0; border-top: 1px solid var(--line); padding-left: 0; }
  }


  /* sections */
  section.block { padding: 96px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 280px 1fr; gap: 48px; }
  @media (max-width: 820px) { section.block { grid-template-columns: 1fr; gap: 28px; padding: 64px 0; } }
  h2 { font-family: var(--serif); font-weight: 400; font-size: 36px; line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
  .block .sub { color: var(--muted); font-size: 14px; margin: 12px 0 0; }

  /* form */
  form { display: grid; gap: 0 32px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 560px) { form { grid-template-columns: 1fr; } }
  .field { display: block; border-bottom: 1px solid var(--line); padding: 18px 0 10px; transition: border-color .15s; }
  .field:focus-within { border-color: var(--text); }
  .field.full { grid-column: 1 / -1; }
  .field span { display: block; font-size: 12px; letter-spacing: .06em; color: var(--muted); }
  .field input, .field select, .field textarea {
    width: 100%; border: 0; background: transparent; color: var(--text);
    font: 16px var(--sans); padding: 6px 0 0; outline: none; appearance: none; border-radius: 0;
  }
  .field textarea { resize: vertical; min-height: 64px; }
  .field select { cursor: pointer; }
  .field select option { background: var(--bg); color: var(--text); }
  .form-foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 20px 28px; margin-top: 36px; }
  .note { font-size: 13px; color: var(--muted); }

  /* portfolio */
  .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .list a {
    display: grid; grid-template-columns: 1fr auto 24px; align-items: baseline; gap: 16px;
    padding: 20px 0; border-bottom: 1px solid var(--line); text-decoration: none; transition: padding .2s;
  }
  .list a:hover { padding-left: 8px; }
  .list .n { font-family: var(--serif); font-size: 28px; letter-spacing: -0.01em; line-height: 1.1; }
  .list .n i { font-style: normal; color: var(--faint); }
  .list .p { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }
  .list .arr { color: var(--faint); transition: color .2s, transform .2s; }
  .list a:hover .arr { color: var(--text); transform: translateX(3px); }
  .list a.current { opacity: .35; pointer-events: none; }

  footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 32px 0 48px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" id="brand" href="/">dobava.si</a>
    <div class="lang" role="group" aria-label="Jezik / Language">
      <button type="button" data-lang="sl">SL</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main>
    <div class="hero">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="domain"></h1>
      <p class="lead" id="lead"></p>
      <div class="deal" id="deal" hidden>
        <div>
          <div class="price-label" data-i18n="priceLabel"></div>
          <div class="price" data-i18n="priceValue"></div>
        </div>
        <div class="actions">
          <a class="btn" href="#offer"><span data-i18n="makeOffer"></span> <span aria-hidden="true">→</span></a>
        </div>
      </div>
    </div>

    <div class="facts">
      <div><b data-i18n="f1t"></b><span data-i18n="f1"></span></div>
      <div><b data-i18n="f2t"></b><span data-i18n="f2"></span></div>
      <div><b data-i18n="f3t"></b><span data-i18n="f3"></span></div>
    </div>

    <section class="block" id="offer">
      <div>
        <h2 data-i18n="formTitle"></h2>
        <p class="sub" data-i18n="formSub"></p>
      </div>
      <form id="offerForm">
        <label class="field"><span data-i18n="name"></span>
          <input name="name" required autocomplete="name">
        </label>
        <label class="field"><span data-i18n="email"></span>
          <input name="email" type="email" required autocomplete="email">
        </label>
        <label class="field"><span data-i18n="domainLabel"></span>
          <select name="domain" id="domainSelect"></select>
        </label>
        <label class="field"><span data-i18n="offerLabel"></span>
          <input name="offer" inputmode="numeric" required>
        </label>
        <label class="field full"><span data-i18n="message"></span>
          <textarea name="message" rows="2"></textarea>
        </label>
        <div class="form-foot">
          <button class="btn" type="submit" data-i18n="send"></button>
          <span class="note"><span data-i18n="or"></span> <a id="mail" href="#"></a></span>
        </div>
      </form>
    </section>

    <section class="block">
      <div>
        <h2 id="listTitle"></h2>
        <p class="sub" data-i18n="listSub"></p>
      </div>
      <ul class="list" id="list"></ul>
    </section>
  </main>

  <footer>
    <span>© <span id="year"></span> dobava.si</span>
    <a id="mail2" href="#"></a>
  </footer>
</div>

<script>
  // ===== Nastavitve =====
  // E-naslov, na katerega pridejo ponudbe.
  const CONTACT_EMAIL = "info@digihelp.si";

  const DOMAINS = [
    "agentwork.si", "modelflow.si", "mindcore.si", "flowhub.si", "findapp.si", "overnight.si",
    "agentworker.si", "agentish.si", "irisgo.si", "lyrie.si", "gritt.si", "ringg.si"
  ];
  // ======================

  const NAMES = DOMAINS;

  const T = {
    sl: {
      locale: "sl-SI",
      eyebrow: "Premium domena · na prodaj",
      hubEyebrow: "Portfelj · " + DOMAINS.length + " domen",
      title: d => d + " je naprodaj",
      lead: "Kratko, zapomnljivo ime za vaš naslednji produkt. Domena je pripravljena za takojšen prenos.",
      hubTitle: "Premium .si domene",
      hubLead: "Izbrana imena za AI, SaaS in digitalne produkte. Pripravljena za takojšen prenos.",
      priceLabel: "Status",
      priceValue: "Sprejemamo ponudbe",
      makeOffer: "Oddaj ponudbo",
      f1t: "Varen prenos", f1: "Po plačilu prejmete kodo za prenos domene.",
      f2t: "Plačilo po dogovoru", f2: "Predračun ali posrednik (escrow).",
      f3t: "Hiter odgovor", f3: "Na vsako ponudbo odgovorimo v 48 urah.",
      formTitle: "Oddajte ponudbo",
      formSub: "Navedite znesek, ki ga ponujate. Vse ponudbe obravnavamo zaupno.",
      name: "Ime / podjetje",
      email: "E-pošta",
      domainLabel: "Domena",
      offerLabel: "Ponudba (EUR)",
      message: "Sporočilo",
      send: "Oddaj ponudbo",
      or: "ali",
      listTitle: "Celoten portfelj",
      otherTitle: "Druge domene",
      listSub: "Za vse domene sprejemamo ponudbe.",
      subject: d => "Ponudba za domeno " + d,
      body: f => `Domena: ${f.domain}\nPonudba: ${f.offer || "-"} EUR\nIme: ${f.name}\nE-pošta: ${f.email}\n\n${f.message}`
    },
    en: {
      locale: "en-GB",
      eyebrow: "Premium domain · for sale",
      hubEyebrow: "Portfolio · " + DOMAINS.length + " domains",
      title: d => d + " is for sale",
      lead: "A short, memorable name for your next product. Ready for immediate transfer.",
      hubTitle: "Premium .si domains",
      hubLead: "Curated names for AI, SaaS and digital products. Ready for immediate transfer.",
      priceLabel: "Status",
      priceValue: "Accepting offers",
      makeOffer: "Make an offer",
      f1t: "Secure transfer", f1: "After payment you receive the domain transfer code.",
      f2t: "Flexible payment", f2: "Invoice or escrow.",
      f3t: "Fast reply", f3: "We answer every offer within 48 hours.",
      formTitle: "Make an offer",
      formSub: "Tell us how much you would like to offer. All offers are confidential.",
      name: "Name / company",
      email: "Email",
      domainLabel: "Domain",
      offerLabel: "Offer (EUR)",
      message: "Message",
      send: "Send offer",
      or: "or",
      listTitle: "Full portfolio",
      otherTitle: "Other domains",
      listSub: "All domains are open to offers.",
      subject: d => "Offer for domain " + d,
      body: f => `Domain: ${f.domain}\nOffer: ${f.offer || "-"} EUR\nName: ${f.name}\nEmail: ${f.email}\n\n${f.message}`
    }
  };

  // Katera domena je obiskana: pot (/agentwork.si), ?d=… ali ime gostitelja.
  const segs = location.pathname.split("/").filter(x => x && x !== "index.html")
                 .map(x => decodeURIComponent(x).toLowerCase());
  const pathDomain = NAMES.includes(segs[segs.length - 1]) ? segs[segs.length - 1] : null;
  // Osnovna pot strani brez domene, npr. "/" ali "/domene/".
  const BASE = "/" + segs.slice(0, pathDomain ? -1 : undefined).map(x => x + "/").join("");

  function detectDomain() {
    const p = new URLSearchParams(location.search).get("d");
    const host = location.hostname.replace(/^www\./, "").toLowerCase();
    const cand = (p || pathDomain || host).toLowerCase().replace(/^www\./, "");
    return NAMES.includes(cand) ? cand : null;
  }

  let current = detectDomain();
  let saved = null;
  try { saved = localStorage.getItem("lang"); } catch (e) {}
  let lang = saved || ((navigator.language || "").startsWith("sl") ? "sl" : "en");

  const $ = id => document.getElementById(id);
  const split = n => { const i = n.lastIndexOf("."); return [n.slice(0, i), n.slice(i)]; };

  function go(d) {
    current = d;
    history.pushState(null, "", d ? BASE + d : BASE);
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n]; });
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));

    const d = current;
    const h1 = $("domain");
    h1.textContent = "";
    if (d) {
      const [base, tld] = split(d);
      h1.append(base);
      const s = document.createElement("span");
      s.className = "tld"; s.textContent = tld;
      h1.append(s);
    } else {
      h1.textContent = t.hubTitle;
    }
    $("eyebrow").textContent = d ? t.eyebrow : t.hubEyebrow;
    $("lead").textContent = d ? t.lead : t.hubLead;
    document.title = d ? t.title(d) : t.hubTitle;

    $("deal").hidden = !d;

    $("domainSelect").value = d || NAMES[0];
    $("listTitle").textContent = d ? t.otherTitle : t.listTitle;

    const list = $("list");
    list.innerHTML = "";
    NAMES.forEach(x => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = BASE + x;
      if (x === d) a.className = "current";
      const [base, tld] = split(x);
      const n = document.createElement("span"); n.className = "n";
      n.append(base);
      const i = document.createElement("i"); i.textContent = tld; n.append(i);
      const p = document.createElement("span"); p.className = "p";
      p.textContent = t.makeOffer;
      const arr = document.createElement("span"); arr.className = "arr"; arr.textContent = "→";
      a.append(n, p, arr);
      a.onclick = e => {
        if (location.protocol === "file:") return;
        e.preventDefault();
        go(x);
      };
      li.appendChild(a);
      list.appendChild(li);
    });

    const href = "mailto:" + CONTACT_EMAIL + "?subject=" + encodeURIComponent(t.subject(d || NAMES[0]));
    ["mail", "mail2"].forEach(id => { $(id).textContent = CONTACT_EMAIL; $(id).href = href; });
  }

  NAMES.forEach(n => $("domainSelect").add(new Option(n, n)));

  $("brand").onclick = e => {
    if (location.protocol === "file:") return;
    e.preventDefault();
    go(null);
  };

  document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("lang", lang); } catch (e) {}
    render();
  });

  $("offerForm").onsubmit = e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const t = T[lang];
    location.href = "mailto:" + CONTACT_EMAIL +
      "?subject=" + encodeURIComponent(t.subject(f.domain)) +
      "&body=" + encodeURIComponent(t.body(f));
  };

  window.onpopstate = () => { current = detectDomain(); render(); };

  $("year").textContent = new Date().getFullYear();
  render();
</script>
</body>
</html>
